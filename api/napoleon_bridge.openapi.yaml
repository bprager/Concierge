openapi: 3.1.0
info:
  title: Napoleon Bridge API
  version: 0.1.0
  description: Local Concierge bridge contract aligned with Napoleon Chief of Staff contract-only integration surfaces.
paths:
  /v1/concierge/turn:
    post:
      summary: Submit a Text Concierge turn using CoS, governance, profile, and observability envelopes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - traceId
                - conversationId
                - turnId
                - profile
                - profileMode
                - channel
                - message
                - chiefOfStaffRequest
                - governanceRequest
                - traceEnvelope
                - auditEnvelope
                - blockedEffects
                - sourceEvidence
              properties:
                traceId:
                  type: string
                conversationId:
                  type: string
                turnId:
                  type: string
                profile:
                  type: string
                  enum: [adult_owner, child_protected, guest, collaborator]
                profileMode:
                  type: string
                  enum: [adult_owner, child_protected_user, guest, collaborator]
                channel:
                  type: string
                  enum: [text]
                message:
                  type: string
                descriptorStatus:
                  type: object
                  properties:
                    serviceId:
                      type: string
                    ready:
                      type: boolean
                    runtimeAuthority:
                      type: boolean
                    cachePolicy:
                      type: string
                    blockedEffects:
                      type: array
                      items:
                        type: string
                descriptorConnection:
                  type: object
                  properties:
                    state:
                      type: string
                      enum: [no_endpoint, missing_descriptor, descriptor_mismatch, ready]
                    checksumState:
                      type: string
                      enum: [not_checked, matched, mismatch]
                    signatureState:
                      type: string
                      enum: [not_checked, valid, invalid]
                    canAttemptLiveBridge:
                      type: boolean
                    failClosedReason:
                      type: string
                      enum:
                        - no_endpoint
                        - no_descriptor
                        - descriptor_invalid
                        - descriptor_signature_or_checksum_mismatch
                    message:
                      type: string
                chiefOfStaffRequest:
                  type: object
                  required: [request_id, requester, request_type, profile_mode, source_evidence, requested_authority_tier, trace_id]
                governanceRequest:
                  type: object
                  required: [request_id, actor_id, action, target, requested_authority_tier, evidence_links, trace_id]
                traceEnvelope:
                  type: object
                  required: [trace_id, parent_trace_id, actor_id, request_id, decision_id, timestamp]
                auditEnvelope:
                  type: object
                  required: [audit_id, trace_id, decision_id, actor_id, authority_tier, approval_requirement, evidence_links]
                blockedEffects:
                  type: array
                  items:
                    type: string
                sourceEvidence:
                  type: array
                  items:
                    type: string
                derivedSignals:
                  type: object
      responses:
        "200":
          description: Napoleon response with governance and audit context
          content:
            application/json:
              schema:
                type: object
                required: [text, governanceDecision, traceEnvelope, auditEnvelope]
                properties:
                  text:
                    type: string
                  governanceDecision:
                    type: object
                    required:
                      - decision_id
                      - request_id
                      - outcome
                      - authority_tier
                      - approval_requirement
                      - rationale
                      - blocked_effects
                      - trace_id
                      - audit_id
                    properties:
                      decision_id:
                        type: string
                      request_id:
                        type: string
                      outcome:
                        type: string
                        enum: [allow_prepare_only, deny, requires_review, no_go]
                      authority_tier:
                        type: string
                        enum: [metadata_only, advisory_review, prepare_only, approval_required, prohibited]
                      approval_requirement:
                        type: string
                      rationale:
                        type: string
                      blocked_effects:
                        type: array
                        items:
                          type: string
                      trace_id:
                        type: string
                      audit_id:
                        type: string
                  traceEnvelope:
                    type: object
                    required: [trace_id, parent_trace_id, actor_id, request_id, decision_id, timestamp]
                    properties:
                      trace_id:
                        type: string
                      parent_trace_id:
                        type: string
                      actor_id:
                        type: string
                      request_id:
                        type: string
                      decision_id:
                        type: string
                      timestamp:
                        type: string
                  auditEnvelope:
                    type: object
                    required: [audit_id, trace_id, decision_id, actor_id, authority_tier, approval_requirement, evidence_links]
                    properties:
                      audit_id:
                        type: string
                      trace_id:
                        type: string
                      decision_id:
                        type: string
                      actor_id:
                        type: string
                      authority_tier:
                        type: string
                        enum: [metadata_only, advisory_review, prepare_only, approval_required, prohibited]
                      approval_requirement:
                        type: string
                      evidence_links:
                        type: array
                        items:
                          type: string
                  profileMode:
                    type: string
                  targetAgent:
                    type: string
                  delegation:
                    type: object
                    required: [selectedAgents, allowedEffects, blockedEffects, governanceState, traceId, auditId]
                    properties:
                      selectedAgents:
                        type: array
                        items:
                          type: object
                          required: [agentId, displayName, selectionReason]
                          properties:
                            agentId:
                              type: string
                            displayName:
                              type: string
                            selectionReason:
                              type: string
                            contributionSummary:
                              type: string
                      allowedEffects:
                        type: array
                        items:
                          type: string
                      blockedEffects:
                        type: array
                        items:
                          type: string
                      governanceState:
                        type: string
                      traceId:
                        type: string
                      auditId:
                        type: string
                  stance:
                    type: string
                  requiresConfirmation:
                    type: boolean
  /v1/concierge/chief-of-staff/descriptor:
    get:
      summary: Return the local view of the Napoleon Chief of Staff descriptor
      responses:
        "200":
          description: Local descriptor status
          content:
            application/json:
              schema:
                type: object
                required: [serviceId, ready, runtimeAuthority, cachePolicy, blockedEffects]
                properties:
                  serviceId:
                    type: string
                  ready:
                    type: boolean
                  runtimeAuthority:
                    type: boolean
                  cachePolicy:
                    type: string
                  blockedEffects:
                    type: array
                    items:
                      type: string
                  connection:
                    type: object
                    properties:
                      state:
                        type: string
                        enum: [no_endpoint, missing_descriptor, descriptor_mismatch, ready]
                      checksumState:
                        type: string
                        enum: [not_checked, matched, mismatch]
                      signatureState:
                        type: string
                        enum: [not_checked, valid, invalid]
                      canAttemptLiveBridge:
                        type: boolean
  /v1/concierge/evaluate:
    post:
      summary: Submit evaluator prompt to Napoleon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [case_id, prompt]
              properties:
                case_id:
                  type: string
                prompt:
                  type: string
      responses:
        "200":
          description: Napoleon design response
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text:
                    type: string
